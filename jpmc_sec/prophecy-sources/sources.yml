        type: "Double"
    - name: "Number of working Days"
      dataType:
        type: "Double"
    type: "table"
  - name: "catalog_privileges"
    description: "Monthly working-day counts with associated weights to support calculations\
      \ that depend on business days, such as payroll, capacity planning, and performance\
      \ attribution."
    config:
      tags:
      - "pipeline:CEM_Securities_PruVal_6m_Trade_Volume_Upload_v_1_0_1_"
    columns:
    - name: "Month"
      description: "The calendar month for which privileges are reported, used to\
        \ group and compare monthly entitlement metrics."
      dataType:
        type: "Date"
    - name: "Weights"
      description: "Relative factor applied to the month's privileges to adjust allocations\
        \ or prorated entitlements."
      dataType:
        type: "Double"
    type: "table"
